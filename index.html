
<script>
document.addEventListener("DOMContentLoaded", function () {

  // Direccion de tus codigos en GitHub
  const base = "https://raw.githubusercontent.com/badrehaha10-creator/badrehaha10-creator.github.io/main/";

  const ejercicios = [
    {
      nombre: "Ejercicio con scanf",
      archivo: "tecnoscanf.c",
      buscar: /scanf/i
    },
    {
      nombre: "Funcion propia",
      archivo: "tecnofuncio.c",
      buscar: /funci[oó]n|funcio/i
    },
    {
      nombre: "Ejercicio tecnob3",
      archivo: "tecnob3.c",
      buscar: /tecnob3/i
    }
  ];

  // Crear el visor de codigos
  const visor = document.createElement("section");
  visor.id = "visor-c";
  visor.className = "container my-5";

  visor.innerHTML = `
    <div class="card shadow">
      <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h3 id="tituloC" class="mb-0">Programacion en C</h3>

        <button id="copiarC" class="btn btn-outline-primary btn-sm">
          <i class="fa-solid fa-copy"></i> Copiar codigo
        </button>
      </div>

      <div class="card-body">
        <p class="text-secondary">
          Consulta los ejercicios de programacion en C.
        </p>

        <pre style="background:#171923;color:#e5e7eb;padding:20px;border-radius:8px;overflow-x:auto;min-height:200px;"><code id="contenidoC">Selecciona un ejercicio del menu.</code></pre>

        <p id="estadoC" class="small text-secondary mb-0"></p>
      </div>
    </div>
  `;

  document.querySelector("main").appendChild(visor);

  const contenido = document.getElementById("contenidoC");
  const titulo = document.getElementById("tituloC");
  const estado = document.getElementById("estadoC");

  // Buscar el menu de Programacion en C
  const menus = document.querySelectorAll(".nav-item.dropdown");

  let menuC = null;

  menus.forEach(menu => {
    if (/programaci[oó]n en c|programacio en c/i.test(
      menu.querySelector(".nav-link")?.textContent || ""
    )) {
      menuC = menu.querySelector(".dropdown-menu");
    }
  });

  // Cargar un ejercicio dentro de la pagina
  async function cargarCodigo(ejercicio) {

    titulo.textContent = ejercicio.nombre;
    contenido.textContent = "Cargando codigo...";
    estado.textContent = "";

    visor.scrollIntoView({ behavior: "smooth" });

    try {
      const respuesta = await fetch(base + ejercicio.archivo);

      if (!respuesta.ok) {
        throw new Error("No se ha encontrado el archivo.");
      }

      const codigo = await respuesta.text();

      contenido.textContent = codigo;
      estado.textContent = "Codigo cargado correctamente.";

    } catch (error) {
      contenido.textContent = "No se ha podido cargar el codigo.";
      estado.textContent = error.message;
    }
  }

  // Crear los enlaces automaticamente
  if (menuC) {

    ejercicios.forEach(ejercicio => {

      let enlace = Array.from(menuC.querySelectorAll("a"))
        .find(a => ejercicio.buscar.test(a.textContent));

      if (!enlace) {
        const li = document.createElement("li");
        enlace = document.createElement("a");

        enlace.className = "dropdown-item";
        enlace.textContent = ejercicio.nombre;

        li.appendChild(enlace);
        menuC.appendChild(li);
      }

      enlace.href = "#visor-c";

      enlace.addEventListener("click", function(event) {
        event.preventDefault();
        cargarCodigo(ejercicio);

        // Cerrar el menu desplegable de Bootstrap
        const botonMenu = menuC.parentElement.querySelector(".dropdown-toggle");

        if (botonMenu && window.bootstrap) {
          const instancia = bootstrap.Dropdown.getInstance(botonMenu);

          if (instancia) instancia.hide();
        }
      });

    });

  }

  // Copiar el codigo
  document.getElementById("copiarC").addEventListener("click", async function() {

    try {
      await navigator.clipboard.writeText(contenido.textContent);

      this.innerHTML = '<i class="fa-solid fa-check"></i> Copiado';

      setTimeout(() => {
        this.innerHTML = '<i class="fa-solid fa-copy"></i> Copiar codigo';
      }, 2000);

    } catch (error) {
      estado.textContent = "No se ha podido copiar el codigo.";
    }

  });

});
</script>
